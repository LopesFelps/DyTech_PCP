<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Papelaria Central Parque</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* Estilos customizados */
    body {
      font-family: 'Poppins', sans-serif;
      position: relative;
      overflow-x: hidden;
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #f1f1f1;
    }

    ::-webkit-scrollbar-thumb {
      background: #663399; /* Cor roxa */
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #5a2d8a;
    }

    /* NOVO ESTILO: Banner de Cabeçalho */
    .header-banner {
      background: linear-gradient(135deg, rgba(102, 51, 153, 0.9), rgba(0, 0, 0, 0.8));
      min-height: 40vh;
    }
  </style>
</head>

<body class="min-h-screen bg-white relative">

  <nav class="bg-purple-900 shadow-lg sticky top-0 z-50">
    <div class="container mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center">
        <a href="index.html#home"><img src="assets/logo2.jpg" alt="Logo Papelaria Central Parque" class="w-12 h-12 rounded-full object-cover p-1 shadow" /></a>
      </div>

      <button id="mobile-menu-button" class="md:hidden focus:outline-none text-white">
        <i class="fas fa-bars text-2xl"></i>
      </button>

      <div class="hidden md:flex space-x-8">
        <a href="index.html#home" class="text-white hover:text-purple-300 transition flex flex-col items-center">
          <i class="fas fa-home text-xl"></i>
          <span class="text-xs mt-1">Home</span>
        </a>

        <a href="orcamentos.html" class="text-white hover:text-purple-300 transition flex flex-col items-center">
          <i class="fas fa-dollar-sign text-xl"></i>
          <span class="text-xs mt-1">Orçamentos</span>
        </a>

        <a href="produtos.html" class="text-white hover:text-purple-300 transition flex flex-col items-center">
          <i class="fas fa-shopping-bag text-xl"></i>
          <span class="text-xs mt-1">Produtos</span>
        </a>
        
        <a href="usuario.html" class="text-white hover:text-purple-300 transition flex flex-col items-center">
          <i class="fas fa-user text-xl mb-1"></i>
          <span class="text-xs mt-0">Login</span>
        </a>
      </div>
    </div>

    <div id="mobile-menu" class="hidden md:hidden bg-purple-800 px-4 py-2">

      <a href="index.html#home" class="block py-2 text-white hover:text-purple-300 transition flex items-center">
        <i class="fas fa-home mr-3"></i> Home
      </a>
      <a href="orcamentos.html" class="block py-2 text-white hover:text-purple-300 transition flex items-center">
        <i class="fas fa-dollar-sign mr-3"></i> Orçamentos
      </a>
      <a href="produtos.html" class="block py-2 text-white hover:text-purple-300 transition flex items-center">
        <i class="fas fa-shopping-bag mr-3"></i> Produtos
      </a>
      <a href="usuario.html" class="block py-2 text-white hover:text-purple-300 transition flex items-center">
        <i class="fas fa-user mr-3"></i> Login
      </a>
    </div>
  </nav>
  <header class="header-banner flex items-center justify-center text-white text-center">
    <div class="container mx-auto px-4 py-16">
      <h1 class="text-4xl md:text-5xl font-bold mb-4">Crie sua Conta</h1>
      <p class="text-lg md:text-xl">Preencha seus dados para começar a aproveitar a plataforma.</p>
    </div>
  </header>
  <main class="flex items-center justify-center px-4 py-10">
    <div class="w-full max-w-2xl mx-auto bg-purple-900 rounded-2xl shadow-xl p-8 md:p-12">
      <h1 class="text-3xl md:text-4xl font-extrabold text-center mb-3 text-white">Cadastro de Usuário</h1>
      <p class="text-center text-purple-200 mb-10">Faça o seu cadastro e aproveite a plataforma!</p>

      <form id="cadastro-form" class="space-y-5">
        <input type="text" name="nome" id="nome" placeholder="Nome" required
               class="w-full px-4 py-3 rounded-lg bg-white text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-300"/>

        <input type="email" name="email" id="email" placeholder="E-mail" required
               class="w-full px-4 py-3 rounded-lg bg-white text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-300"/>

        <input type="tel" name="telefone" id="telefone" placeholder="Telefone / WhatsApp (Opcional)"
               class="w-full px-4 py-3 rounded-lg bg-white text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-300"/>

        <input type="password" name="senha" id="senha" placeholder="Senha" required minlength="6"
               class="w-full px-4 py-3 rounded-lg bg-white text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-300"/>

        <input type="password" name="confirmar" id="confirmar" placeholder="Confirmar senha" required minlength="6"
               class="w-full px-4 py-3 rounded-lg bg-white text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-300"/>

        <div class="pt-4 text-white">
          <p class="text-lg font-semibold mb-3">Tipo de conta:</p>
          <div class="flex flex-col sm:flex-row gap-6">
            <label class="inline-flex items-center gap-2">
              <input type="radio" name="tipo" value="empresa" class="accent-purple-600" />
              <span>Empresa</span>
            </label>
            <label class="inline-flex items-center gap-2">
              <input type="radio" name="tipo" value="pessoa_fisica" class="accent-purple-600" checked />
              <span>Pessoa física</span>
            </label>
          </div>
        </div>

        <div class="pt-2">
          <button type="submit"
                  class="w-full md:w-auto block mx-auto bg-purple-700 hover:bg-purple-600 transition px-10 py-3 rounded-lg font-semibold text-white">
            CONFIRMAR
          </button>
        </div>
      </form>
    </div>
  </main>


  <footer class="bg-purple-900 text-white py-8">
    <div class="container mx-auto px-4">
      <div class="flex flex-col md:flex-row justify-between items-center">
        <div class="mb-4 md:mb-0">
          <div class="flex items-center space-x-2">
            <div class="w-10 h-10 rounded-full flex items-center justify-center">
              <img src="assets/logopcp.png" alt="Logo Papelaria Central Parque" class="w-12 h-12 rounded-full object-cover p-1 shadow" />
            </div>
          </div>
        </div>

        <div class="flex space-x-6 mb-4 md:mb-0">
          <a href="index.html#home" class="hover:text-purple-300 transition">
            <i class="fas fa-home"></i>
          </a>
          <a href="orcamentos.html" class="hover:text-purple-300 transition">
            <i class="fas fa-dollar-sign"></i>
          </a>
          <a href="produtos.html" class="hover:text-purple-300 transition">
            <i class="fas fa-shopping-bag"></i>
          </a>
          <a href="usuario.html" class="hover:text-purple-300 transition">
            <i class="fas fa-user"></i>
          </a>
        </div>
      </div>

      <div class="border-t border-purple-800 mt-6 pt-6 text-center text-purple-300">
        <p>© 2025 Papelaria e Bazar Central Parque. Todos os direitos reservados.</p>
      </div>
    </div>
  </footer>
  <button id="back-to-top"
    class="fixed bottom-6 right-6 bg-purple-700 hover:bg-purple-600 text-white p-3 rounded-full shadow-lg opacity-0 invisible transition-all duration-300">
    <i class="fas fa-arrow-up"></i>
  </button>
  
  <script>
    // Script para o menu mobile
    document.addEventListener('DOMContentLoaded', () => {
        const mobileMenuButton = document.getElementById('mobile-menu-button');
        const mobileMenu = document.getElementById('mobile-menu');

        if (mobileMenuButton && mobileMenu) {
            mobileMenuButton.addEventListener('click', () => {
                mobileMenu.classList.toggle('hidden');
            });
        }
    });

    // Script do formulário de cadastro
    document.getElementById('cadastro-form').addEventListener('submit', function (e) {
      e.preventDefault();

      const nome      = document.getElementById('nome').value.trim();
      const email     = document.getElementById('email').value.trim();
      const telefone  = document.getElementById('telefone').value.trim(); 
      const senha     = document.getElementById('senha').value.trim();
      const confirmar = document.getElementById('confirmar').value.trim();
      const tipo      = (new FormData(this)).get('tipo'); 

      if (!nome || !email || !senha || !confirmar) {
        alert('Preencha todos os campos obrigatórios (Nome, E-mail, Senha e Confirmação).');
        return;
      }
      if (senha !== confirmar) {
        alert('As senhas não coincidem.');
        return;
      }

      // Guarda o e-mail para facilitar o login
      try { localStorage.setItem('lastRegisteredEmail', email); } catch {}

      if (tipo === 'empresa') {
        // Vai para a tela Empresa (com flag de origem)
        window.location.href = 'empresa.html?from=cadastro';
      } else {
        // Vai direto para Login
        window.location.href = 'usuario.html?registered=1';
      }
    });
  </script>
</body>
</html>
