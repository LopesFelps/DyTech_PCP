<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orçamentos | Papelaria Central Parque</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* Estilos customizados */
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f9fafb;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1MTIgNTEyIj48cGF0aCBmaWxsPSJ1cmwoI2dyYWRpZW50KSIgZD0iTTI1NiA4QzExOSA4IDggMTE5IDggMjU2czExMSAyNDggMjQ4IDI0OCAyNDgtMTExIDI0OC0yNDhTMzkzIDggMjU2IDh6IiBvcGFjaXR5PSIwLjA1Ii8+PHBhdGg... (o resto do SVG) ...dmZwPg==');
      background-size: 50%;
      background-position: center;
      background-repeat: no-repeat;
      opacity: 0.03;
      z-index: -1;
      pointer-events: none;
    }

    .hero-section {
      background: linear-gradient(135deg, rgba(102, 51, 153, 0.9), rgba(0, 0, 0, 0.8)),
        url('https://images.unsplash.com/photo-1518455022959-bd206c94984d?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1470&q=80');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    .card-hover {
      transition: all 0.3s ease;
    }

    .card-hover:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 25px rgba(102, 51, 153, 0.3);
    }

    .social-icon {
      transition: all 0.3s ease;
    }

    .social-icon:hover {
      transform: scale(1.1);
    }

    .animate-fade-in {
      animation: fadeIn 1s ease-in-out;
    }

    .animate-fade-in-up {
      animation: fadeInUp 0.8s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #f1f1f1;
    }

    ::-webkit-scrollbar-thumb {
      background: #663399;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #5a2d8a;
    }

    /* Section divider */
    .section-divider {
      position: relative;
      height: 80px;
      overflow: hidden;
    }

    .section-divider svg {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    /* NOVO ESTILO: Banner de Cabeçalho (igual ao produtos.html) */
    .header-banner {
      background: linear-gradient(135deg, rgba(102, 51, 153, 0.9), rgba(0, 0, 0, 0.8));
      min-height: 40vh;
    }
  </style>
</head>

<body class="relative">
  <nav class="bg-purple-900 shadow-lg sticky top-0 z-50">
    <div class="container mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center">
        <a href="index.html#home"><img src="assets/logo2.jpg" alt="Logo Papelaria Central Parque" class="w-12 h-12 rounded-full object-cover p-1 shadow" /></a>
      </div>

      <button id="mobile-menu-button" class="md:hidden focus:outline-none text-white">
        <i class="fas fa-bars text-2xl"></i>
      </button>

      <div class="hidden md:flex space-x-8">
        <a href="index.html#home" class="text-white hover:text-purple-300 transition flex flex-col items-center">
          <i class="fas fa-home text-xl"></i>
          <span class="text-xs mt-1">Home</span>
        </a>

        <a href="orcamentos.html" class="text-purple-300 font-bold transition flex flex-col items-center">
          <i class="fas fa-dollar-sign text-xl"></i>
          <span class="text-xs mt-1">Orçamentos</span>
        </a>

        <a href="produtos.html" class="text-white hover:text-purple-300 transition flex flex-col items-center">
          <i class="fas fa-shopping-bag text-xl"></i>
          <span class="text-xs mt-1">Produtos</span>
        </a>
        
        <a href="usuario.html" class="text-white hover:text-purple-300 transition flex flex-col items-center">
          <i class="fas fa-user text-xl mb-1"></i>
          <span class="text-xs mt-0">Login</span>
        </a>
      </div>
    </div>

    <div id="mobile-menu" class="hidden md:hidden bg-purple-800 px-4 py-2">
      <a href="index.html#home" class="block py-2 text-white hover:text-purple-300 transition flex items-center">
        <i class="fas fa-home mr-3"></i> Home
      </a>
      <a href="orcamentos.html" class="block py-2 text-purple-300 font-bold transition flex items-center">
        <i class="fas fa-dollar-sign mr-3"></i> Orçamentos
      </a>
      <a href="produtos.html" class="block py-2 text-white hover:text-purple-300 transition flex items-center">
        <i class="fas fa-shopping-bag mr-3"></i> Produtos
      </a>
      <a href="usuario.html" class="block py-2 text-white hover:text-purple-300 transition flex items-center">
        <i class="fas fa-user mr-3"></i> Login
      </a>
    </div>
  </nav>

  <header class="header-banner flex items-center justify-center text-white text-center">
    <div class="container mx-auto px-4 py-16">
      <h1 class="text-4xl md:text-5xl font-bold mb-4">Solicite seu Orçamento</h1>
      <p class="text-lg md:text-xl">Preencha o formulário para serviços de impressão, encadernação e mais.</p>
    </div>
  </header>
  
  <section id="Orçamentos" class="flex items-center justify-center bg-white py-16">
    <div class="container mx-auto px-4">
      <div class="max-w-2xl mx-auto bg-purple-900 rounded-2xl p-8 shadow-xl">
        <h2 class="text-3xl md:text-4xl font-bold text-center mb-2 text-white">Formulário de Orçamento</h2>
        <p class="text-center text-purple-200 mb-8">Faça o orçamento dos serviços da Papelaria!</p>

        <form id="orcamento-form" class="space-y-4">
          <input type="text" name="produto" placeholder="Produto"
            class="w-full px-4 py-3 rounded-lg bg-white text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-300" required>

          <input type="text" name="servico" placeholder="Serviço"
            class="w-full px-4 py-3 rounded-lg bg-white text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-300" required>

          <input type="number" name="quantidade" placeholder="Quantidade" min="1"
            class="w-full px-4 py-3 rounded-lg bg-white text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-300" required>

          <textarea name="observacao" rows="6" placeholder="Observação"
            class="w-full px-4 py-3 rounded-lg bg-white text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-300"></textarea>

          <div class="pt-2">
            <button type="submit"
              class="w-full md:w-auto block mx-auto bg-purple-700 hover:bg-purple-600 transition px-8 py-3 rounded-lg font-semibold text-white">
              CONFIRMAR
            </button>
          </div>
        </form>
      </div>
    </div>
  </section>

  <footer class="bg-purple-900 text-white py-8">
    <div class="container mx-auto px-4">
      <div class="flex flex-col md:flex-row justify-between items-center">
        <div class="mb-4 md:mb-0">
          <div class="flex items-center space-x-2">
            <div class="w-10 h-10 rounded-full flex items-center justify-center">
              <img src="assets/logopcp.png" alt="Logo Papelaria Central Parque" class="w-12 h-12 rounded-full object-cover p-1 shadow" />
            </div>
          </div>
        </div>

        <div class="flex space-x-6 mb-4 md:mb-0">
          <a href="index.html#home" class="hover:text-purple-300 transition">
            <i class="fas fa-home"></i>
          </a>
          <a href="orcamentos.html" class="hover:text-purple-300 transition">
            <i class="fas fa-dollar-sign"></i>
          </a>
          <a href="produtos.html" class="hover:text-purple-300 transition">
            <i class="fas fa-shopping-bag"></i>
          </a>
          <a href="usuario.html" class="hover:text-purple-300 transition">
            <i class="fas fa-user"></i>
          </a>
        </div>
      </div>

      <div class="border-t border-purple-800 mt-6 pt-6 text-center text-purple-300">
        <p>© 2025 Papelaria e Bazar Central Parque. Todos os direitos reservados.</p>
      </div>
    </div>
  </footer>
  <button id="back-to-top"
    class="fixed bottom-6 right-6 bg-purple-700 hover:bg-purple-600 text-white p-3 rounded-full shadow-lg opacity-0 invisible transition-all duration-300">
    <i class="fas fa-arrow-up"></i>
  </button>
  
  <script>
    // Script para o menu mobile
    document.addEventListener('DOMContentLoaded', () => {
        const mobileMenuButton = document.getElementById('mobile-menu-button');
        const mobileMenu = document.getElementById('mobile-menu');

        if (mobileMenuButton && mobileMenu) {
            mobileMenuButton.addEventListener('click', () => {
                mobileMenu.classList.toggle('hidden');
            });
        }
    });

    // Script do formulário de orçamento
    document.getElementById('orcamento-form').addEventListener('submit', function (e) {
      e.preventDefault();
      alert('Orçamento enviado! Entraremos em contato em breve.');
      this.reset();
    });
  </script>
</body>
</html>
