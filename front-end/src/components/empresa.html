<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Papelaria Central Parque</title>

  <!-- Tailwind via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font Awesome (opcional) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="min-h-screen bg-gradient-to-br from-purple-900 via-purple-800 to-purple-700 text-white relative">

  <!-- Logo -->
  <img src="assets/logo2.jpg" alt="Logo Papelaria Central Parque"
       class="fixed top-3 left-3 w-10 h-10 rounded-full object-cover z-50 opacity-90" />

  <main class="min-h-screen flex items-center justify-center px-4 py-10">
    <div class="w-full max-w-2xl mx-auto bg-white/10 backdrop-blur-md rounded-2xl shadow-xl p-8 md:p-12 text-center">
      <h1 class="text-3xl md:text-4xl font-extrabold mb-3">Empresa</h1>
      <p class="text-purple-200 mb-10">Cadastre a sua empresa!</p>

      <form id="empresa-form" class="space-y-6">
        <input type="text" name="cnpj" id="cnpj" placeholder="CNPJ"
               class="w-full max-w-2xl mx-auto px-4 py-3 rounded-lg bg-white text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-300"/>

        <div class="pt-2">
          <button type="submit"
                  class="w-full md:w-auto block mx-auto bg-purple-700 hover:bg-purple-600 transition px-10 py-3 rounded-lg font-semibold">
            CONFIRMAR
          </button>
        </div>
      </form>
    </div>
  </main>

  <a href="cadastro.html" class="fixed bottom-4 right-4 bg-white/20 hover:bg-white/30 px-4 py-2 rounded-lg">
    <i class="fas fa-arrow-left mr-2"></i>Voltar
  </a>

  <script>
    // (Opcional) só permite acesso vindo do cadastro
    (function () {
      const params = new URLSearchParams(window.location.search);
      if (params.get('from') !== 'cadastro') {
        // Se quiser liberar acesso direto, remova este bloco
        // history.replaceState(null, '', 'empresa.html'); // limpar query
        // return;
      }
    })();

    // Validação simples e redirecionamento para Login
    document.getElementById('empresa-form').addEventListener('submit', function (e) {
      e.preventDefault();
      const cnpj = document.getElementById('cnpj').value.trim();

      if (!cnpj) {
        alert('Preencha o CNPJ.');
        return;
      }

      // (Opcional) guardar CNPJ
      try { localStorage.setItem('lastCnpj', cnpj); } catch {}

      // Depois de confirmar a empresa, vai para a tela de login
      window.location.href = 'usuario.html?registered=1';
    });
  </script>
</body>
</html>
